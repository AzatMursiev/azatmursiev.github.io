<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<link rel="icon" href="avatar.jpg">
<meta property="og:title" content="Азат Мурсиев">

<style>
  :root{
    --bg:#f4f5fb; --bg2:#eaecf6; --card:#fff; --border:#e2e5f0;
    --text:#15161d; --muted:#646a7d; --accent:#5b5bf0;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e0f15; --bg2:#14151f; --card:#181927; --border:#272939;
           --text:#eceef6; --muted:#949ab0; --accent:#8b8bff; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:radial-gradient(ellipse 90% 70% at 50% 0%,var(--bg2),var(--bg));
    color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:380px;text-align:center}

  .avatar{
    width:112px;height:112px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto 22px;
    border:3px solid var(--card);
    box-shadow:0 6px 28px rgba(20,22,50,.16);
  }
  h1{
    margin:0 0 8px;font-size:27px;font-weight:700;letter-spacing:-.02em;
  }
  .tag{
    margin:0 0 30px;color:var(--muted);font-size:15px;line-height:1.55;
  }
  .tag b{color:var(--text);font-weight:600}

  nav{display:grid;gap:9px}
  nav a{
    display:flex;align-items:center;gap:12px;
    padding:13px 16px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    font-size:15px;font-weight:500;text-align:left;
    transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  nav a:hover{
    border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(20,22,50,.10);
  }
  nav svg{flex:none;width:19px;height:19px;stroke:var(--accent);
          fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav svg.solid{fill:var(--accent);stroke:none}
  nav .sub{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}

  footer{margin-top:26px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="card">

  <img class="avatar" src="avatar.jpg" width="112" height="112"
       alt="Азат Мурсиев">

  <p class="tag"><b>Системный аналитик</b><br>
     пет-проекты на PHP, Python и JS</p>

      devlinks <span class="sub">каталог инструментов</span>

    <a href="https://github.com/AzatMursiev">
      <svg class="solid" viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7 0-.7 0-.7 1.2.1 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4 18.3 4.3 18.3 4.3c.7 1.7.3 2.9.1 3.2.8.9 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/></svg>
      GitHub <span class="sub">AzatMursiev</span>
